# Сборка NothingVpnSetup.exe и публикация в GitHub Releases при push тега v* (например v0.1.0).
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия установщика без префикса v (например 0.1.0)'
        required: true
        default: '0.1.0'

permissions:
  contents: write

env:
  DOTNET_VERSION: '8.0.x'
  # Версия sing-box из https://github.com/SagerNet/sing-box/releases (имя архива sing-box-VERSION-windows-amd64.zip)
  SING_BOX_VERSION: '1.13.12'
  SING_BOX_SHA256: 'e93fc531134eb1beb4efa3c74990a24e48456098a31c03b60d5ddf17f223cf98'
  WINTUN_VERSION: '0.14.1'
  WINTUN_SHA256: '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'
  INNO_SETUP_VERSION: '6.7.1'
  RUNTIME_ASSETS_REL: artifacts\runtime

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Версия для Inno Setup
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $raw = $env:GITHUB_REF_NAME
            $v = $raw -replace '^v',''
            "APP_VERSION=$v" >> $env:GITHUB_ENV
            "tag_name=$raw" >> $env:GITHUB_OUTPUT
          } else {
            $v = "${{ github.event.inputs.version }}".Trim()
            if (-not $v) { throw "version is required" }
            "APP_VERSION=$v" >> $env:GITHUB_ENV
            "tag_name=v$v" >> $env:GITHUB_OUTPUT
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Скачать sing-box (windows-amd64)
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ver = $env:SING_BOX_VERSION
          $name = "sing-box-$ver-windows-amd64.zip"
          $url = "https://github.com/SagerNet/sing-box/releases/download/v$ver/$name"
          Invoke-WebRequest -Uri $url -OutFile $name -UseBasicParsing
          $actualHash = (Get-FileHash -LiteralPath $name -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:SING_BOX_SHA256) {
            throw "sing-box SHA-256 mismatch: '$actualHash' vs '$($env:SING_BOX_SHA256)'"
          }
          $dest = Join-Path $env:GITHUB_WORKSPACE "_sb"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Expand-Archive -Path $name -DestinationPath $dest -Force
          $exe = Get-ChildItem -Path $dest -Recurse -Filter sing-box.exe | Select-Object -First 1
          if (-not $exe) { throw "sing-box.exe not found in archive" }
          $assets = Join-Path $env:GITHUB_WORKSPACE $env:RUNTIME_ASSETS_REL
          New-Item -ItemType Directory -Path $assets -Force | Out-Null
          Copy-Item -LiteralPath $exe.FullName -Destination (Join-Path $assets "sing-box.exe") -Force

      - name: Скачать Wintun (wintun.dll)
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ver = $env:WINTUN_VERSION
          $zip = "wintun-$ver.zip"
          $url = "https://www.wintun.net/builds/$zip"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          $actualHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:WINTUN_SHA256) {
            throw "Wintun SHA-256 mismatch: '$actualHash' vs '$($env:WINTUN_SHA256)'"
          }
          $dest = Join-Path $env:GITHUB_WORKSPACE "_wt"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $dll = Get-ChildItem -Path $dest -Recurse -Filter wintun.dll | Where-Object { $_.FullName -match 'amd64' } | Select-Object -First 1
          if (-not $dll) { throw "wintun.dll (amd64) not found" }
          $assets = Join-Path $env:GITHUB_WORKSPACE $env:RUNTIME_ASSETS_REL
          New-Item -ItemType Directory -Path $assets -Force | Out-Null
          Copy-Item -LiteralPath $dll.FullName -Destination (Join-Path $assets "wintun.dll") -Force

      - name: Установить Inno Setup
        run: choco install innosetup --version=${{ env.INNO_SETUP_VERSION }} -y --no-progress

      - name: Тесты, publish и установщик
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:APP_VERSION)) { throw "APP_VERSION is empty" }
          $repoUrl = "https://github.com/${{ github.repository }}"
          .\build\Build.ps1 -Target Test
          .\build\Build.ps1 -Target Publish `
            -Version $env:APP_VERSION `
            -RuntimeAssetsDirectory $env:RUNTIME_ASSETS_REL
          .\build\Build.ps1 -Target Installer `
            -Version $env:APP_VERSION `
            -RepositoryUrl $repoUrl
          $exe = Join-Path $env:GITHUB_WORKSPACE "artifacts\publish\win-x64\NothingVpn.Tray.exe"
          $pv = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe).ProductVersion
          if ($pv -notlike "$($env:APP_VERSION)*") {
            throw "Версия в PE не совпадает с APP_VERSION: '$pv' vs '$($env:APP_VERSION)'"
          }
          "INSTALLER_PATH=$(Join-Path $env:GITHUB_WORKSPACE 'artifacts\installer\NothingVpnSetup.exe')" >> $env:GITHUB_ENV
          "INSTALLER_CHECKSUM_PATH=$(Join-Path $env:GITHUB_WORKSPACE 'artifacts\installer\NothingVpnSetup.exe.sha256')" >> $env:GITHUB_ENV

      - name: Загрузить артефакт (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NothingVpnSetup
          path: |
            ${{ env.INSTALLER_PATH }}
            ${{ env.INSTALLER_CHECKSUM_PATH }}

      - name: GitHub Release (только push тега)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            ${{ env.INSTALLER_PATH }}
            ${{ env.INSTALLER_CHECKSUM_PATH }}
          generate_release_notes: true
