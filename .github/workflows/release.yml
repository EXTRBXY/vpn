# Сборка NothingVpnSetup.exe и публикация в GitHub Releases при push тега v* (например v0.1.0).
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия установщика без префикса v (например 0.1.0)'
        required: true
        default: '0.1.0'

permissions:
  contents: write

env:
  DOTNET_VERSION: '8.0.x'
  # Версия sing-box из https://github.com/SagerNet/sing-box/releases (имя архива sing-box-VERSION-windows-amd64.zip)
  SING_BOX_VERSION: '1.13.12'
  WINTUN_VERSION: '0.14.1'
  PUBLISH_REL: NothingVpn.Tray\bin\Release\net8.0-windows\win-x64\publish

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Версия для Inno Setup
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $raw = $env:GITHUB_REF_NAME
            $v = $raw -replace '^v',''
            "APP_VERSION=$v" >> $env:GITHUB_ENV
            "tag_name=$raw" >> $env:GITHUB_OUTPUT
          } else {
            $v = "${{ github.event.inputs.version }}".Trim()
            if (-not $v) { throw "version is required" }
            "APP_VERSION=$v" >> $env:GITHUB_ENV
            "tag_name=v$v" >> $env:GITHUB_OUTPUT
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Версию брать из $env:APP_VERSION: значения из GITHUB_ENV недоступны в ${{ env.* }}.
      - name: Publish NothingVpn.Tray
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:APP_VERSION)) { throw "APP_VERSION is empty" }
          dotnet publish NothingVpn.Tray\NothingVpn.Tray.csproj -c Release `
            -p:Version=$env:APP_VERSION -p:InformationalVersion=$env:APP_VERSION

      - name: Проверить версию в NothingVpn.Tray.exe
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE ($env:PUBLISH_REL + '\NothingVpn.Tray.exe')
          if (-not (Test-Path -LiteralPath $exe)) { throw "Missing: $exe" }
          $pv = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe).ProductVersion
          Write-Host "ProductVersion=$pv (ожидание: $($env:APP_VERSION))"
          if ($pv -notlike "$($env:APP_VERSION)*") {
            throw "Версия в PE не совпадает с APP_VERSION: '$pv' vs '$($env:APP_VERSION)'"
          }

      - name: Скачать sing-box (windows-amd64)
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ver = $env:SING_BOX_VERSION
          $name = "sing-box-$ver-windows-amd64.zip"
          $url = "https://github.com/SagerNet/sing-box/releases/download/v$ver/$name"
          Invoke-WebRequest -Uri $url -OutFile $name -UseBasicParsing
          $dest = Join-Path $env:GITHUB_WORKSPACE "_sb"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Expand-Archive -Path $name -DestinationPath $dest -Force
          $exe = Get-ChildItem -Path $dest -Recurse -Filter sing-box.exe | Select-Object -First 1
          if (-not $exe) { throw "sing-box.exe not found in archive" }
          $pub = Join-Path $env:GITHUB_WORKSPACE $env:PUBLISH_REL
          Copy-Item -LiteralPath $exe.FullName -Destination (Join-Path $pub "sing-box.exe") -Force

      - name: Скачать Wintun (wintun.dll)
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ver = $env:WINTUN_VERSION
          $zip = "wintun-$ver.zip"
          $url = "https://www.wintun.net/builds/$zip"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          $dest = Join-Path $env:GITHUB_WORKSPACE "_wt"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $dll = Get-ChildItem -Path $dest -Recurse -Filter wintun.dll | Where-Object { $_.FullName -match 'amd64' } | Select-Object -First 1
          if (-not $dll) { throw "wintun.dll (amd64) not found" }
          $pub = Join-Path $env:GITHUB_WORKSPACE $env:PUBLISH_REL
          Copy-Item -LiteralPath $dll.FullName -Destination (Join-Path $pub "wintun.dll") -Force

      - name: Установить Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Собрать установщик (ISCC)
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) { throw "ISCC not found at $iscc" }
          $repoUrl = "https://github.com/${{ github.repository }}"
          & $iscc `
            "/DMyAppVersion=$env:APP_VERSION" `
            "/DMyAppURL=$repoUrl" `
            "installer\NothingVpn.iss"
          $out = Join-Path $env:GITHUB_WORKSPACE "installer\Output\NothingVpnSetup.exe"
          if (-not (Test-Path -LiteralPath $out)) { throw "Expected output missing: $out" }
          "INSTALLER_PATH=$out" >> $env:GITHUB_ENV

      - name: Загрузить артефакт (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: NothingVpnSetup
          path: ${{ env.INSTALLER_PATH }}

      - name: GitHub Release (только push тега)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.INSTALLER_PATH }}
          generate_release_notes: true
